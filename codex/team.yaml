team_name: "allinpass-delivery-squad"
coordination_skill: "scrum-master"
quality_gate: "reviewer"
security_gate: "cyber-security"
agents:
  - id: "frontend-developer"
    subagent: "./subagents/frontend-developer.yaml"
    skill: "./skills/frontend-developer/SKILL.md"
    mission: "Construir interfaces React/Vite, jornadas do usuario e integracoes cliente."
    primary_skills:
      - "component-architecture"
      - "responsive-ux"
      - "accessibility"
      - "frontend-integration"
    handoff_to:
      - "backend-developer"
      - "reviewer"
  - id: "backend-developer"
    subagent: "./subagents/backend-developer.yaml"
    skill: "./skills/backend-developer/SKILL.md"
    mission: "Implementar edge functions, contratos de dados, SQL e regras de negocio."
    primary_skills:
      - "api-design"
      - "database-modeling"
      - "supabase-functions"
      - "integration-reliability"
    handoff_to:
      - "frontend-developer"
      - "cyber-security"
      - "reviewer"
  - id: "cyber-security"
    subagent: "./subagents/cyber-security.yaml"
    skill: "./skills/cyber-security/SKILL.md"
    mission: "Revisar ameacas, autenticacao, autorizacao, segredos e superficie de ataque."
    primary_skills:
      - "threat-modeling"
      - "auth-hardening"
      - "secret-handling"
      - "risk-prioritization"
    handoff_to:
      - "backend-developer"
      - "reviewer"
  - id: "reviewer"
    subagent: "./subagents/reviewer.yaml"
    skill: "./skills/reviewer/SKILL.md"
    mission: "Fazer review com foco em bugs, UX design e software testing."
    primary_skills:
      - "code-review"
      - "ux-design"
      - "software-testing"
      - "regression-analysis"
    handoff_to: []
